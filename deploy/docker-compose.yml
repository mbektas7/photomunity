# Photomunity — tek sunucu kurulumu (Ubuntu + Docker).
# Kullanım: cp .env.example .env  →  değerleri doldur  →  docker compose up -d --build
#
# Dışarıya yalnızca Caddy açılır (80/443). Adresler:
#   https://$DOMAIN         web
#   https://api.$DOMAIN     API (WebSocket dahil)
#   https://media.$DOMAIN   fotoğraflar (yalnızca photos/ herkese açık) ve doğrudan yükleme

x-api-env: &api-env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  FRONTEND_URL: https://${DOMAIN}
  CORS_ORIGINS: '["https://${DOMAIN}"]'
  DATABASE_URL: postgresql+asyncpg://photomunity:${POSTGRES_PASSWORD}@db:5432/photomunity
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://minio:9000
  S3_PUBLIC_ENDPOINT_URL: https://media.${DOMAIN}
  S3_REGION: us-east-1
  S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  S3_BUCKET: photomunity
  CDN_BASE_URL: https://media.${DOMAIN}/photomunity
  TRUST_PROXY_HEADERS: "true"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api, minio]

  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: photomunity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: photomunity
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photomunity -d photomunity"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]

  minio:
    # Docker Hub'daki minio/minio artık güncellenmiyor; aynı komutlarla çalışan topluluk sürümü.
    image: pgsty/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: https://${DOMAIN}
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -fs http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: pgsty/minio:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb -p local/photomunity &&
      mc anonymous set download local/photomunity/photos"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    restart: "no"

  api:
    build: ../photomunity-api
    restart: unless-stopped
    env_file: .env
    environment: *api-env
    # Her açılışta veritabanı şeması güncellenir, sonra API başlar.
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30

  worker:
    build: ../photomunity-api
    restart: unless-stopped
    env_file: .env
    environment: *api-env
    command: ["arq", "app.worker.WorkerSettings"]
    depends_on:
      api: { condition: service_healthy }

  web:
    build:
      context: ../photomunity-web
      args:
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
        NEXT_PUBLIC_WS_URL: wss://api.${DOMAIN}/api/v1/ws
        NEXT_PUBLIC_APPLE_REDIRECT_URI: https://${DOMAIN}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_APPLE_CLIENT_ID: ${NEXT_PUBLIC_APPLE_CLIENT_ID:-}
        NEXT_PUBLIC_ADSENSE_CLIENT: ${NEXT_PUBLIC_ADSENSE_CLIENT:-}
        NEXT_PUBLIC_ADSENSE_SLOT_FEED: ${NEXT_PUBLIC_ADSENSE_SLOT_FEED:-}
        NEXT_PUBLIC_ADSENSE_SLOT_BANNER: ${NEXT_PUBLIC_ADSENSE_SLOT_BANNER:-}
        NEXT_PUBLIC_APP_STORE_URL: ${NEXT_PUBLIC_APP_STORE_URL:-}
        NEXT_PUBLIC_PLAY_STORE_URL: ${NEXT_PUBLIC_PLAY_STORE_URL:-}
        NEXT_PUBLIC_LEGAL_ENTITY: ${NEXT_PUBLIC_LEGAL_ENTITY:-}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
        APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
        ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
    restart: unless-stopped
    environment:
      API_URL: http://api:8000/api/v1
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
    depends_on:
      api: { condition: service_healthy }

  backup:
    # Günlük veritabanı yedeği: ./backups altında, 14 günden eski olanlar silinir.
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes: [./backups:/backups]
    entrypoint: >
      /bin/sh -c "while true; do
      pg_dump -h db -U photomunity -d photomunity -Fc -f /backups/photomunity-$$(date +%Y%m%d-%H%M).dump &&
      find /backups -name '*.dump' -mtime +14 -delete;
      sleep 86400; done"
    depends_on:
      db: { condition: service_healthy }

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  redisdata:
  miniodata:
