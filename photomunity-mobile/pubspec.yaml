name: photomunity
description: Photomunity — fotoğrafçılar için topluluk uygulaması.
publish_to: none
version: 1.0.0+2

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  go_router: ^16.2.0
  dio: ^5.9.0
  flutter_secure_storage: ^9.2.4
  cached_network_image: ^3.4.1
  image_picker: ^1.2.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  intl: ^0.20.2
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.1
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  web_socket_channel: ^3.0.3
  camera: ^0.11.2
  sensors_plus: ^6.1.1
  google_mobile_ads: ^6.0.0
  purchases_flutter: ^9.0.0
  lucide_icons_flutter: ^4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # google_mobile_ads yalnızca CocoaPods destekliyor; SwiftPM ile birlikte iOS derlemesi çakışıyor.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Variable.ttf
