services:
  db:
    image: postgis/postgis:16-3.4   # PostGIS Faz 3'teki harita sorguları için hazır
    environment: { POSTGRES_USER: photomunity, POSTGRES_PASSWORD: photomunity, POSTGRES_DB: photomunity }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 3; mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/photomunity; mc anonymous set download local/photomunity/photos"
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://photomunity:photomunity@db:5432/photomunity
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    ports: ["8000:8000"]
    depends_on: [db, redis, minio]
  worker:
    build: .
    command: arq app.worker.WorkerSettings
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://photomunity:photomunity@db:5432/photomunity
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    depends_on: [db, redis, minio]
volumes: { pgdata: {}, minio: {} }
